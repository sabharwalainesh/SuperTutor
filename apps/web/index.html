<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#155d52" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Less stuck. More understanding. Import from Canvas, practice from your notes, and learn with your tutor in Superhuman Go." />
    <!-- The server sends the authoritative policy; this keeps the dev server honest too.
         Monaco runs its language services in a blob worker, and the dev server needs its websocket. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws://localhost:5173 ws://127.0.0.1:5173; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
    />
    <title>SuperTutor — Make it click</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
